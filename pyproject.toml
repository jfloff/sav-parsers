[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sav-parsers"
version = "0.10.1"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-documentai>=2.20",
    "python-dotenv>=1.0",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sav_parsers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
